name: Container

# Publishes ghcr.io/adongojr2/clockify-cli on main pushes (latest) and version tags.
# Pull requests build (but do not push) to catch Dockerfile regressions.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.5.0); leave empty for latest'
        required: false

permissions:
  contents: read
  packages: write

# Run every action on the Node 24 runtime.
env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24

jobs:
  image:
    name: build & publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}  # classic PAT with read:packages + write:packages scopes

      - name: Derive image tags
        id: meta
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete stale latest tag (rebuild guard)
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        run: |
          set -euo pipefail
          # Step 1: find the version id of the existing :latest tag (needs read:packages).
          api_url="https://api.github.com/user/packages/container/clockify-cli/versions"
          versions_response=$(curl -s -o /tmp/versions.json -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.GHCR_PAT }}" "$api_url") || true
          echo "DIAG versions_response=$versions_response" >&2
          version_id=$(cat /tmp/versions.json | jq -r '.[] | select(.metadata.container.tags | index("latest")) | .id' | head -1) || true
          echo "DIAG version_id=$version_id" >&2
          if [ -z "$version_id" ]; then
            echo "No existing ghcr.io/latest tag found; nothing to delete"
          else
            # GHCR_PAT has read:packages + write:packages scopes, so it can delete the package version.
            echo "Deleting ghcr.io/latest package version $version_id (removes :latest tag) with GHCR_PAT"
            status=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${{ secrets.GHCR_PAT }}" \
              "https://api.github.com/user/packages/container/clockify-cli/versions/$version_id") || true
            echo "DIAG delete_status=$status" >&2
            if echo "$status" | grep -qE '^20[0-4]$'; then
              echo "Stale :latest tag + manifests deleted; rebuilding cleanly"
            else
              echo "ERROR: failed to delete ghcr.io/latest (HTTP $status); aborting" >&2
              exit 1
            fi
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=clockify-cli
            org.opencontainers.image.description=Colorful Clockify time-tracking CLI
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### Container published"
            echo ""
            echo "- image: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo "- platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo ""
            echo '```bash'
            echo "docker pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
            echo "docker run --rm -it -v clockify-config:/config ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} list"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
